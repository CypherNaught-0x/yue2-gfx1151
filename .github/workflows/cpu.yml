name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without GPU dependencies
        run: |
          python -m pip install --no-deps .
          python -m pip install numpy==2.2.6 soundfile==0.13.1
      - name: CPU source and input validation
        run: python -m unittest discover -s tests -v
      - name: Container command construction tests
        run: python -m unittest discover -s container -p 'test_*.py' -v
      - name: Shell syntax and installed CLI
        run: |
          bash -n scripts/build-container.sh scripts/run-container.sh
          yue2-gfx1151 --help
          yue2-gfx1151 generate --help
      - name: Compile source and opt-in GPU benchmarks
        run: python -m compileall -q src benchmarks
