[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yue2-gfx1151"
version = "0.1.0"
description = "Optimized non-commercial YuE2 inference for AMD gfx1151"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "MODEL_LICENSE", "NOTICE.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = []

[project.optional-dependencies]
runtime = ["transformers==4.57.6", "huggingface-hub==0.36.2", "safetensors==0.7.0", "tiktoken==0.12.0", "numpy==2.2.6", "soundfile==0.13.1", "accelerate==1.13.0"]

[project.scripts]
yue2-gfx1151 = "yue2_gfx1151.cli:main"
yue2 = "yue2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
